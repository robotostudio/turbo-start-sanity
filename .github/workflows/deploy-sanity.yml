name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - "packages/sanity/**"
      - "packages/sanity-blocks/**"
      - "packages/env/**"
      - "packages/logger/**"
      - "packages/ui/**"
      - "packages/tailwind-config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-sanity.yml"
  workflow_dispatch:
    inputs:
      presentation_url:
        description: "Frontend URL for Presentation tool (defaults to secret on main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-sanity-studio
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Sanity Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
      NODE_OPTIONS: "--max_old_space_size=4096"
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_TITLE: ${{ secrets.SANITY_STUDIO_TITLE }}
      SANITY_STUDIO_PRESENTATION_URL: ${{ inputs.presentation_url || secrets.SANITY_STUDIO_PRESENTATION_URL }}
      SANITY_STUDIO_APP_ID: ${{ secrets.SANITY_STUDIO_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Deploy Sanity Studio
        working-directory: ./apps/studio
        run: pnpm run deploy
        env:
          CI: true
