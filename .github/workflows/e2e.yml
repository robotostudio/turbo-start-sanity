name: E2E Smoke Tests

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright Smoke Tests
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
      NEXT_PUBLIC_VERCEL_PROJECT_PRODUCTION_URL: ${{ github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Browsers are fetched here because the install step above passes
      # --ignore-scripts, which skips Playwright's postinstall download.
      # The binary is called directly instead of through `pnpm exec` so that
      # `pnpm ... install` does not read as a package install (SonarQube
      # S6505). Playwright's `install` downloads browsers and has no
      # --ignore-scripts option of its own.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
